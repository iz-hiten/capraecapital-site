# ═══════════════════════════════════════════════════════════════════════════════
#  Caprae Capital Domains
#
#  capraecapital.com          → services site (canonical host: bare)
#  capraecapitalpartners.com  → corporate site (canonical host: bare)
#
#  SSL managed by Certbot.
# ═══════════════════════════════════════════════════════════════════════════════


# ── capraecapital.com (services site) ────────────────────────────────────────

server {
    server_name capraecapital.com;

    root /home/ubuntu/caprae-site/caprae-capital-services;
    error_page 404 /404.html;
    index index.html;

    # Security / SEO headers
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ── 301 redirects for legacy multi-page URLs Google still has indexed ──
    location = /book                                 { return 301 /#contact;  }
    location = /client-testimonials                  { return 301 /#results;  }
    location = /testimonials-and-shoutouts           { return 301 /#results;  }
    location = /services                             { return 301 /#services; }
    location = /services/ai-readiness-assessment    { return 301 /#services; }
    location = /copy-of-services                     { return 301 /#services; }
    location = /entrepreneurship-as-a-service-eaas   { return 301 /#services; }
    location = /legacy-as-a-service-laas             { return 301 /#services; }
    location = /contact-us                           { return 301 /#contact;  }
    location = /submission                           { return 301 /#contact;  }
    location = /map                                  { return 301 /;          }
    location = /team                                 { return 301 /;          }
    location = /about-5                              { return 301 /;          }
    location = /blog                                 { return 301 /;          }
    location = /careers                              { return 301 /;          }
    location = /internships                          { return 301 /;          }
    location = /bda-internships                      { return 301 /;          }
    location = /research-internship                  { return 301 /;          }
    location = /research-lab                         { return 301 /;          }
    location ~ ^/post/ { return 301 https://capraecapitalpartners.substack.com/; }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/capraecapital.com.access.log;
    error_log  /var/log/nginx/capraecapital.com.error.log;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/capraecapital.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/capraecapital.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# ── capraecapital.com www → bare ─────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name www.capraecapital.com;
    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://capraecapital.com$request_uri;

    ssl_certificate /etc/letsencrypt/live/capraecapital.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/capraecapital.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}


# ── capraecapitalpartners.com (corporate site) ───────────────────────────────

server {
    server_name capraecapitalpartners.com;

    root /home/ubuntu/caprae-site/caprae-capital-corporate/public;
    error_page 404 /404.html;
    index index.html;

    # Security / SEO headers
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Reverse-proxy the apply API to the Node service (caprae-apply.service)
    # on 127.0.0.1:8080. Must come before `location /` so it wins the match.
    location /api/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
        proxy_connect_timeout 5s;
        client_max_body_size  64k;
    }

    # Old staging path — content permanently moved to /field-notes/ (301)
    location = /sandbox { return 301 https://capraecapitalpartners.com/field-notes/; }
    location /sandbox/ {
        add_header Strict-Transport-Security "max-age=31536000" always;
        rewrite ^/sandbox/field-notes/(.*)$ /field-notes/$1 permanent;
        rewrite ^/sandbox/(.*)$ /field-notes/$1 permanent;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/capraecapitalpartners.com.access.log;
    error_log  /var/log/nginx/capraecapitalpartners.com.error.log;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/capraecapital.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/capraecapital.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# ── capraecapitalpartners.com www → bare ─────────────────────────────────────
server {
    listen 443 ssl;
    server_name www.capraecapitalpartners.com;
    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://capraecapitalpartners.com$request_uri;

    ssl_certificate /etc/letsencrypt/live/capraecapital.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/capraecapital.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}


# ── Redirect old subdomains to new domains ───────────────────────────────────

server {
    listen 80;
    server_name services.capraecapital.com;
    return 301 https://capraecapital.com$request_uri;
}

server {
    listen 80;
    server_name corporate.capraecapital.com;
    return 301 https://capraecapitalpartners.com$request_uri;
}


# ── HTTP → HTTPS (services) ──────────────────────────────────────────────────
server {
    listen 80;
    server_name capraecapital.com www.capraecapital.com;
    return 301 https://capraecapital.com$request_uri;
}

# ── HTTP → HTTPS (corporate) ─────────────────────────────────────────────────
server {
    listen 80;
    server_name capraecapitalpartners.com www.capraecapitalpartners.com;
    return 301 https://capraecapitalpartners.com$request_uri;
}
