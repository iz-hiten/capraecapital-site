# ═══════════════════════════════════════════════════════════════════════════════
#  dev-caprae.saasquatchleads.com — independent dev copy of capraecapital.com
#
#  Static site, web root: /home/ubuntu/dev-caprae-site/site  (this repo, site/ dir)
#  Deploy: sudo cp this to /etc/nginx/sites-available/dev-caprae.saasquatchleads.com
#  Search engines are blocked (robots.txt + X-Robots-Tag).
# ═══════════════════════════════════════════════════════════════════════════════

server {
    server_name dev-caprae.saasquatchleads.com;

    root /home/ubuntu/dev-caprae-site/site;
    error_page 404 /404.html;
    index index.html;

    # keep this dev mirror out of every index
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ── legacy URL redirects, mirrored from the production config ──
    location = /book                                { return 301 /contact/;  }
    location = /client-testimonials                 { return 301 /results/;  }
    location = /testimonials-and-shoutouts          { return 301 /results/;  }
    location = /services/ai-readiness-assessment    { return 301 /services/ai-readiness/; }
    location = /copy-of-services                    { return 301 /services/; }
    location = /entrepreneurship-as-a-service-eaas  { return 301 /services/entrepreneurship-as-a-service/; }
    location = /legacy-as-a-service-laas            { return 301 /services/; }
    location = /contact-us                          { return 301 /contact/;  }
    location = /submission                          { return 301 /contact/;  }
    location = /branding                            { return 301 /services/branding/; }
    location = /how                                 { return 301 /how-it-works/; }
    location = /map                                 { return 301 /;          }
    location = /team                                { return 301 /;          }
    location = /about-5                             { return 301 /;          }
    location = /blog                                { return 301 /;          }
    location = /careers                             { return 301 /;          }
    location = /internships                         { return 301 /;          }
    location = /bda-internships                     { return 301 /;          }
    location = /research-internship                 { return 301 /;          }
    location = /research-lab                        { return 301 /;          }
    location ~ ^/post/ { return 301 https://capraecapitalpartners.substack.com/; }

    # ── Page URLs ──
    # Every page is a directory (/pricing/index.html), so the canonical form
    # has a trailing slash. Send the slash-less form there explicitly (nginx's
    # own directory redirect can leak the internal port behind a proxy).
    location ~ ^/(services|how-it-works|results|pricing|contact)$ { return 301 /$1/; }
    location ~ ^/services/([a-z-]+)$                           { return 301 /services/$1/; }
    # Capitalised spelling from the original URL spec
    location = /services/Post-acquisition-strategy  { return 301 /services/post-acquisition-strategy/; }
    location = /services/Post-acquisition-strategy/ { return 301 /services/post-acquisition-strategy/; }

    # dev mirror: override the repo's production robots.txt, and hide indexing artifacts
    location = /robots.txt {
        add_header Content-Type text/plain;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        return 200 "User-agent: *\nDisallow: /\n";
    }
    location = /sitemap.xml { return 404; }
    location ~ ^/google[0-9a-f]+\.html$ { return 404; }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/dev-caprae.saasquatchleads.com.access.log;
    error_log  /var/log/nginx/dev-caprae.saasquatchleads.com.error.log;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/dev-caprae.saasquatchleads.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dev-caprae.saasquatchleads.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = dev-caprae.saasquatchleads.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name dev-caprae.saasquatchleads.com;
    return 404; # managed by Certbot


}